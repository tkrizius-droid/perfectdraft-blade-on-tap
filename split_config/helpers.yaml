# =========================================================
# helpers.yaml
# Generic/export copies of the helper entities used by the
# PerfectDraft + Blade "On Tap" dashboard.
#
# These are the WORKING configs captured from the source
# installation, made location-neutral. An installer creates
# exactly these helpers (via YAML packages or the UI) and the
# rest of the package works.
#
# NOTE: blade_current_keg, blade_pints_remaining,
# blade_keg_inserted and pours_keg_start were UI-created
# helpers on the source machine. Their captured configs below
# are equivalent YAML that reproduces them.
# =========================================================

