# =========================================================
# templates.yaml
# Generic/export copies of the template sensors used by the
# PerfectDraft + Blade "On Tap" dashboard.
#
# - Blade Keg Freshness ......... from configuration.yaml (YAML)
# - PerfectDraft Pints Remaining  from a UI Template entry
# - PerfectDraft Pours This Keg .. from a UI Template entry
# - PerfectDraft Current Keg ABV . from a UI Template entry,
#                                  renamed to the PUBLIC entity name
#                                  sensor.perfectdraft_current_keg_abv
#
# The ABV lookup values are preserved EXACTLY as supplied by the
# source installation. They have not been modified, regenerated,
# corrected, deduplicated or replaced.
# =========================================================

template:
  - sensor:
      # -----------------------------------------------------
      # Blade Keg Freshness (30-day countdown)
      # Source entity: input_datetime.blade_keg_inserted
      # -----------------------------------------------------
      - name: "Blade Keg Freshness"
        unique_id: blade_keg_freshness
        unit_of_measurement: "d"
        icon: mdi:calendar-clock
        state: >
          {% set inserted = states('input_datetime.blade_keg_inserted') %}
          {% if inserted and inserted not in ['unknown', 'unavailable', 'none', ''] %}
            {% set days = ((now().timestamp() - as_timestamp(inserted)) / 86400) | int %}
            {{ [30 - days, 0] | max }}
          {% else %}
            unavailable
          {% endif %}
        attributes:
          keg_inserted_at: "{{ states('input_datetime.blade_keg_inserted') }}"

      # -----------------------------------------------------
      # PerfectDraft Pints Remaining
      # Source entity: sensor.perfectdraft_pro_keg_remaining
      # (auto-provided by the PerfectDraft HACS integration)
      # 6L keg / 0.568 L per pint ~= 10.5 pints, scaled by %
      # -----------------------------------------------------
      - name: "PerfectDraft Pints Remaining"
        unique_id: perfectdraft_pints_remaining
        unit_of_measurement: "pints"
        state_class: measurement
        icon: mdi:beer
        state: >
          {{ (states('sensor.perfectdraft_pro_keg_remaining') | float(0) / 100 * 10.5) | round(1) }}

      # -----------------------------------------------------
      # PerfectDraft Pours This Keg
      # Source entities:
      #   sensor.perfectdraft_pro_pours (integration, monotonic)
      #   input_number.pours_keg_start  (helper, baseline at keg change)
      # -----------------------------------------------------
      - name: "PerfectDraft Pours This Keg"
        unique_id: perfectdraft_pours_this_keg
        icon: mdi:glass-mug-variant
        state: >
          {{ states('sensor.perfectdraft_pro_pours') | int(0) - states('input_number.pours_keg_start') | int(0) }}

      # -----------------------------------------------------
      # PerfectDraft Current Keg ABV
      # PUBLIC entity name: sensor.perfectdraft_current_keg_abv
      # Source entity: input_select.perfectdraft_current_keg
      #
      # ABV values preserved EXACTLY as supplied. Do not edit.
      # -----------------------------------------------------
      - name: "PerfectDraft Current Keg ABV"
        unique_id: perfectdraft_current_keg_abv
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >
          {% set keg = states('input_select.perfectdraft_current_keg') %}

          {% set abv = {
            "Bass Pale Ale": 4.4,
